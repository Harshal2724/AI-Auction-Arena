# Render Blueprint for a single-origin full-stack deployment.
# The free database is intended for evaluation; choose a paid database for durable production use.
services:
  - type: web
    name: ai-auction-arena
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-auction-arena-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.

databases:
  - name: ai-auction-arena-db
    databaseName: auction_arena
    user: auction
    plan: free
