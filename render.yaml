# Render Blueprint for AI Auction Arena.
# The application source lives in the ai-auction-arena/ directory.
services:
  - type: web
    name: ai-auction-arena
    runtime: docker
    plan: free
    rootDir: ai-auction-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-auction-arena-db
          property: connectionString

databases:
  - name: ai-auction-arena-db
    databaseName: auction_arena
    user: auction
    plan: free
